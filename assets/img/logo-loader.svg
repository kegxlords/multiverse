<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Orbit -->
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#cosmicGrad)" stroke-width="2" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Inner Orbit -->
  <ellipse cx="50" cy="50" rx="30" ry="10" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Core Star -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
