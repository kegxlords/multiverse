<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - My Packages</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="universe-bg"></div>
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <header class="app-header glass">
    <a href="dashboard.html" class="icon-btn" style="text-decoration:none;">‹</a>
    <div class="logo" style="font-size: 18px;">MY PACKAGES</div>
    <div style="width: 40px;"></div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Your Fleet</h1>
    <p class="page-subtitle">Track your active packages and daily progress.</p>

    <div id="myMinersList" class="miner-list">
      <div class="glass glass-card" style="text-align:center; padding: 30px;">Loading your fleet...</div>
    </div>
  </main>

  <nav class="bottom-nav glass">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
    <a href="rent-miners.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg><span>Catalog</span></a>
    <a href="wallet.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Wallet</span></a>

    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
  </nav>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const remainingCountdown = target => {
      const remaining = new Date(target).getTime() - Date.now();
      if (remaining <= 0) return 'Income due — waiting for payout cron';
      const hours = Math.floor(remaining / 3600000);
      const minutes = Math.floor((remaining % 3600000) / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);
      return `Next income in ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    };
    const countdownText = target => remainingCountdown(target);
    function refreshCountdowns() {
      document.querySelectorAll('[data-payout-at]').forEach(el => {
        el.textContent = `Income timer: ${remainingCountdown(el.dataset.payoutAt)}`;
        if (Date.now() >= new Date(el.dataset.payoutAt).getTime()) el.classList.add('text-warning');
      });
    }
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      const list = document.getElementById('myMinersList');
      if (!session) return;
      const { data: miners, error } = await window.supabaseClient.from('user_miners')
        .select('*, miners(name, daily_revenue, duration_days, image_url)')
        .eq('user_id', session.user.id).order('created_at', { ascending: false });
      if (error) {
        list.innerHTML = '<div class="glass glass-card" style="text-align:center;color:var(--danger);">Unable to load your packages.</div>';
        return;
      }
      if (!miners || miners.length === 0) {
        list.innerHTML = '<div class="glass glass-card" style="text-align:center; padding: 30px; color: var(--text-muted);">You have no packages yet. <a href="rent-miners.html" style="color: var(--accent);">Browse the catalog!</a></div>';
        return;
      }
      list.innerHTML = miners.map(m => {
        const miner = m.miners;
        const duration = Number(miner?.duration_days || 1);
        const days = Number(m.days_collected || 0);
        const progress = Math.min(100, Math.round((days / duration) * 100));
        const completed = m.status === 'completed';
        const nextPayout = new Date(m.created_at).getTime() + (days + 1) * 86400000;
        return `<div class="glass glass-card miner-card">
          <div class="miner-img-box"><img src="${escapeHtml(miner?.image_url || 'https://cdn-icons-png.flaticon.com/512/2721/2721698.png')}" alt="${escapeHtml(miner?.name || 'Package')}"></div>
          <div class="miner-info">
            <div class="miner-name">${escapeHtml(miner?.name || 'Package')}</div>
            <div class="miner-specs"><span>Yield: <b>₦${Number(miner?.daily_revenue || 0).toLocaleString()}</b></span><span>Days: <b>${days} / ${duration}</b></span></div>
            <div class="progress-container"><div class="progress-bar" style="width:${progress}%"></div></div>
            <span class="status-badge ${completed ? 'status-completed' : 'status-active'}">${completed ? 'Completed' : 'Active'} • ${progress}%</span>
            ${completed ? '<div class="text-muted" style="margin-top:8px;font-size:12px;">All income cycles credited</div>' : `<div class="payout-countdown text-accent" data-payout-at="${new Date(nextPayout).toISOString()}" style="margin-top:8px;font-size:12px;font-weight:700;">Income timer: ${countdownText(nextPayout)}</div>`}
          </div>
        </div>`;
      }).join('');
      refreshCountdowns();
      setInterval(refreshCountdowns, 1000);
    });
  </script>
</body>
</html>
