<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - Login</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- Sticky Universe Background -->
  <div class="universe-bg"></div>

  <!-- Universe Loader -->
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <!-- Login Content -->
  <div class="auth-wrapper">
    <div class="auth-card glass">
      <div class="auth-content">
        <div class="auth-logo">MULTIVERSE</div>
        <p class="auth-subtitle">Sign in to manage your cosmic portfolio</p>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" placeholder="explorer@multiverse.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="Enter your password" required />
          </div>
          
          <button type="submit" class="btn-primary">INITIATE LOGIN</button>
        </form>

        <div class="auth-links">
          Don't have an account? <a href="register.html">Join the Universe</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
