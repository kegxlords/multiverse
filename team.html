<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - My Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .level-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 15px; }
    .level-tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; font-family: 'Orbitron'; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.3s; }
    .level-tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px var(--primary-glow); }
  </style>
</head>
<body>
  <div class="universe-bg"></div>
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <header class="app-header glass">
    <div class="logo"><div class="logo-icon">M</div> MULTIVERSE</div>
    <div class="header-actions"><a href="dashboard.html" class="icon-btn">‹</a></div>
  </header>

  <main class="main-content">
    <h1 class="page-title">My Team</h1>
    <p class="page-subtitle">Track your 3-level network and their deposits.</p>

    <div class="referral-card glass">
      <div class="referral-label">Your Referral Link</div>
      <div class="referral-link-box">
        <input type="text" id="refLink" value="Loading..." readonly />
        <button onclick="copyRef()">COPY</button>
      </div>
    </div>

    <div class="level-tabs">
      <div class="level-tab active" onclick="loadLevel(1)">Level 1</div>
      <div class="level-tab" onclick="loadLevel(2)">Level 2</div>
      <div class="level-tab" onclick="loadLevel(3)">Level 3</div>
    </div>

    <div id="memberList" class="member-list">
      <div class="glass glass-card" style="text-align:center; padding: 30px; color: var(--text-muted);">Loading team...</div>
    </div>
  </main>

  <nav class="bottom-nav glass">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
    <a href="rent-miners.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg><span>Miners</span></a>
    <a href="wallet.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Wallet</span></a>
    <a href="team.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Team</span></a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
  </nav>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function copyRef() {
      const input = document.getElementById('refLink');
      navigator.clipboard.writeText(input.value).then(() => showToast('Link copied!', 'success'));
    }

    async function loadLevel(level) {
      document.querySelectorAll('.level-tab').forEach((t, i) => t.classList.toggle('active', i + 1 === level));
      const list = document.getElementById('memberList');
      list.innerHTML = '<div class="glass glass-card" style="text-align:center; padding: 30px;">Loading...</div>';

      const { data: { session } } = await window.supabaseClient.auth.getSession();
      let column = level === 1 ? 'referred_by' : level === 2 ? 'upline_level_2' : 'upline_level_3';
      
      const { data: members } = await window.supabaseClient
        .from('profiles')
        .select('id, full_name, email, created_at, has_deposited, total_deposited')
        .eq(column, session.user.id)
        .order('created_at', { ascending: false });

      if (!members || members.length === 0) {
        list.innerHTML = '<div class="glass glass-card" style="text-align:center; padding: 30px; color: var(--text-muted);">No members at this level yet.</div>';
        return;
      }

      list.innerHTML = '';
      members.forEach(m => {
        const isActive = m.has_deposited;
        const initial = (m.full_name || m.email || 'U')[0].toUpperCase();
        const statusClass = isActive ? 'tag-active' : 'tag-inactive';
        const statusText = isActive ? 'Active' : 'Inactive';
        const depositAmount = Number(m.total_deposited || 0).toLocaleString();

        list.innerHTML += `
          <div class="member-item glass">
            <div class="member-avatar">${initial}</div>
            <div class="member-info">
              <div class="member-name">${m.full_name || 'Anonymous'}</div>
              <div class="member-date">Joined ${new Date(m.created_at).toLocaleDateString()} • Deposited: ₦${depositAmount}</div>
            </div>
            <div class="member-tags">
              <span class="tag ${statusClass}">${statusText}</span>
              <span class="tag tag-level">Lvl ${level}</span>
            </div>
          </div>
        `;
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      const { data: profile } = await window.supabaseClient.from('profiles').select('referral_code').eq('id', session.user.id).single();
      document.getElementById('refLink').value = `${window.location.origin}/register.html?ref=${profile?.referral_code || '---'}`;
      loadLevel(1);
    });
  </script>
</body>
</html>
