<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="universe-bg"></div>

  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card glass">
      <div class="auth-content">
        <div class="auth-logo">MULTIVERSE</div>
        <p class="auth-subtitle">Enter your email to receive a reset link</p>

        <div id="alertBox" class="alert"></div>

        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="explorer@multiverse.com" required />
          </div>
          
          <button type="submit" id="forgotBtn" class="btn-primary">SEND RESET LINK</button>
        </form>

        <div class="auth-links">
          Remember your password? <a href="index.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('forgotBtn');
      const alertBox = document.getElementById('alertBox');

      alertBox.className = 'alert';
      btn.disabled = true;
      btn.innerText = 'SENDING...';

      const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/dashboard.html' 
      });

      if (error) {
        alertBox.textContent = error.message;
        alertBox.className = 'alert alert-error show';
        btn.disabled = false;
        btn.innerText = 'SEND RESET LINK';
      } else {
        alertBox.textContent = '✅ If an account exists, a reset link has been sent to your email.';
        alertBox.className = 'alert alert-success show';
        btn.innerText = 'LINK SENT';
      }
    });
  </script>
</body>
</html>
