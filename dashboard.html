<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- Sticky Universe Background -->
  <div class="universe-bg"></div>

  <!-- Universe Loader -->
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <!-- Top Header -->
  <header class="app-header glass">
    <div class="logo">
      <div class="logo-icon">M</div>
      MULTIVERSE
    </div>
    <div class="header-actions">
      <a href="notifications.html" class="icon-btn">🔔</a>
      <a href="profile.html" class="icon-btn">👤</a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <h1 class="page-title">Welcome, Explorer</h1>
    <p class="page-subtitle">Your cosmic mining operations are running smoothly.</p>

    <!-- Placeholder Cards to show layout -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
      <div class="glass glass-card">
        <div class="text-muted" style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Total Balance</div>
        <div style="font-family: 'Orbitron'; font-size: 24px; margin-top: 8px; color: var(--accent);">₦0.00</div>
      </div>
      <div class="glass glass-card">
        <div class="text-muted" style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Daily Yield</div>
        <div style="font-family: 'Orbitron'; font-size: 24px; margin-top: 8px; color: var(--success);">₦0.00</div>
      </div>
    </div>

    <div class="glass glass-card" style="min-height: 200px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--glass-border);">
      <p class="text-muted">Phase 1 Complete. Dashboard content will be built in Phase 3.</p>
    </div>
  </main>

  <!-- Floating Bottom Navigation (5 Tabs) -->
  <nav class="bottom-nav glass">
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="rent-miners.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
      <span>Miners</span>
    </a>
    <a href="wallet.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      <span>Wallet</span>
    </a>
    <a href="team.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>Team</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="assets/js/app.js"></script>
</body>
</html>
