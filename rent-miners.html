<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="universe-bg"></div>
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <header class="app-header glass">
    <a href="dashboard.html" class="icon-btn" style="text-decoration:none;">‹</a>
    <div class="logo" style="font-size: 18px;">MULTIVERSE CATALOG</div>
    <a href="profile.html" class="icon-btn" aria-label="Profile" style="text-decoration:none;">⌾</a>
  </header>

  <main class="main-content">
    <h1 class="page-title">Choose Your Rig</h1>
    <p class="page-subtitle">Select a mining package to start generating cosmic income.</p>
    <div class="glass" style="display:flex; gap:10px; margin-bottom:20px; padding:12px; border-radius:16px;">
      <a href="my-miners.html" class="btn-primary" style="flex:1; text-align:center;">My Miners</a>
      <a href="profile.html" class="btn-primary" style="flex:1; text-align:center; background:rgba(255,255,255,.06); border:1px solid var(--glass-border);">Profile</a>
    </div>

    <div id="minerCatalog" class="miner-list">
      <div class="glass glass-card" style="text-align:center; padding: 30px;">Loading packages...</div>
    </div>
  </main>

  <nav class="bottom-nav glass">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
    <a href="rent-miners.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg><span>Miners</span></a>
    <a href="wallet.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Wallet</span></a>
    <a href="team.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Team</span></a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
  </nav>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      const catalog = document.getElementById('minerCatalog');

      // Fetch available miners
      const { data: miners, error } = await window.supabaseClient.from('miners').select('*').eq('is_active', true).order('price', { ascending: true });

      if (error || !miners) {
        catalog.innerHTML = '<div class="glass glass-card" style="text-align:center; color: var(--danger);">Failed to load miners.</div>';
        return;
      }

      catalog.innerHTML = '';
      miners.forEach(m => {
        const totalReturn = Number(m.daily_revenue) * Number(m.duration_days);
        catalog.innerHTML += `
          <div class="glass glass-card miner-card">
            <div class="miner-img-box">
              <img src="${m.image_url || 'https://cdn-icons-png.flaticon.com/512/2721/2721698.png'}" alt="${m.name}">
            </div>
            <div class="miner-info">
              <div class="miner-name">${m.name}</div>
              <div class="miner-specs">
                <span>Price: <b>₦${Number(m.price).toLocaleString()}</b></span>
                <span>Daily: <b>₦${Number(m.daily_revenue).toLocaleString()}</b></span>
                <span>Duration: <b>${m.duration_days} Days</b></span>
                <span>Total: <b style="color: var(--success);">₦${totalReturn.toLocaleString()}</b></span>
              </div>
              <button class="btn-rent" onclick="rentMiner('${m.id}', this)">RENT NOW</button>
            </div>
          </div>
        `;
      });
    });

    async function rentMiner(minerId, btn) {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      btn.disabled = true;
      btn.innerText = 'PROCESSING...';

      const res = await fetch('/api/miners', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ minerId })
      });
      const result = await res.json();

      if (result.success) {
        btn.innerText = 'RENTED!';
        btn.style.background = 'var(--success)';
        setTimeout(() => window.location.href = 'my-miners.html', 1000);
      } else {
        alert(result.error || 'Failed to rent miner.');
        btn.disabled = false;
        btn.innerText = 'RENT NOW';
      }
    }
  </script>
</body>
</html>
