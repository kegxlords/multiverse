<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="universe-bg"></div>
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <header class="app-header glass">
    <div class="logo"><div class="logo-icon">M</div> MULTIVERSE</div>
    <div class="header-actions"><a href="dashboard.html" class="icon-btn">‹</a></div>
  </header>

  <main class="main-content">
    <div style="text-align:center; margin-bottom:30px;">
      <div style="width:80px; height:80px; background:linear-gradient(135deg, var(--primary), var(--accent)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Orbitron'; font-size:32px; font-weight:900; margin:0 auto 15px;" id="profileAvatar">U</div>
      <h2 style="font-family:'Orbitron';" id="profileName">Loading...</h2>
      <p class="text-muted" id="profileEmail">...</p>
    </div>

    <div class="glass glass-card" style="margin-bottom:15px;">
      <h3 style="font-family:'Orbitron'; font-size:15px; margin-bottom:15px;">Account Details</h3>
      <form id="profileForm">
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="pName" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" id="pPhone" class="form-input" required></div>
        <button type="submit" class="btn-primary">Update Profile</button>
      </form>
    </div>

    <div class="glass glass-card" style="margin-bottom:15px;">
      <a href="download-app.html" style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--glass-border); text-decoration:none; color:var(--text-main);">
        <span>📱 Download App</span><span>›</span>
      </a>
      <a href="transactions.html" style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--glass-border); text-decoration:none; color:var(--text-main);">
        <span>📜 Transaction History</span><span>›</span>
      </a>
      <a href="notifications.html" style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; text-decoration:none; color:var(--text-main);">
        <span>🔔 Notifications</span><span>›</span>
      </a>
    </div>

    <button onclick="logout()" class="btn-primary" style="background: linear-gradient(135deg, var(--danger), #b91c1c);">Logout</button>
  </main>

  <nav class="bottom-nav glass">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
    <a href="rent-miners.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg><span>Miners</span></a>
    <a href="wallet.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Wallet</span></a>
    <a href="team.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Team</span></a>
    <a href="profile.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
  </nav>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      const { data: profile } = await window.supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
      
      document.getElementById('profileName').textContent = profile.full_name || 'User';
      document.getElementById('profileEmail').textContent = session.user.email;
      document.getElementById('profileAvatar').textContent = (profile.full_name || 'U')[0].toUpperCase();
      document.getElementById('pName').value = profile.full_name || '';
      document.getElementById('pPhone').value = profile.phone || '';
    });

    document.getElementById('profileForm').addEventListener('submit', async e => {
      e.preventDefault();
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      await window.supabaseClient.from('profiles').update({ full_name: document.getElementById('pName').value, phone: document.getElementById('pPhone').value }).eq('id', session.user.id);
      showToast('Profile updated!', 'success');
    });

    async function logout() {
      await window.supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
