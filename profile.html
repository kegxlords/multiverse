<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiVerse - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .profile-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .profile-stat-box { text-align: center; padding: 15px 5px; }
    .profile-stat-box .val { font-family: 'Orbitron'; font-size: 16px; font-weight: 700; margin-top: 5px; }
    .profile-stat-box .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .menu-link { display: flex; align-items: center; gap: 12px; padding: 16px; text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 14px; transition: 0.3s; }
    .menu-link:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }
    .menu-icon { font-size: 20px; width: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="universe-bg"></div>
  <div id="universeLoader" class="loader-overlay">
    <img src="assets/img/logo-loader.svg" alt="Loading" class="loader-svg" />
    <div class="loader-text">ENTERING MULTIVERSE</div>
  </div>

  <header class="app-header glass">
    <div class="logo"><div class="logo-icon">M</div> MULTIVERSE</div>
    <div class="header-actions"><a href="dashboard.html" class="icon-btn">‹</a></div>
  </header>

  <main class="main-content">
    <!-- User Info -->
    <div style="text-align:center; margin-bottom:25px;">
      <div style="width:80px; height:80px; background:linear-gradient(135deg, var(--primary), var(--accent)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Orbitron'; font-size:32px; font-weight:900; margin:0 auto 15px;" id="profileAvatar">U</div>
      <h2 style="font-family:'Orbitron'; font-size: 20px;" id="profileName">Loading...</h2>
      <p class="text-muted" id="profileEmail" style="font-size: 13px;">...</p>
    </div>

    <!-- Stats Table -->
    <div class="glass glass-card profile-stats">
      <div class="profile-stat-box">
        <div class="lbl">Balance</div>
        <div class="val text-accent" id="statBalance">₦0</div>
      </div>
      <div class="profile-stat-box">
        <div class="lbl">Deposited</div>
        <div class="val text-success" id="statDeposit">₦0</div>
      </div>
      <div class="profile-stat-box">
        <div class="lbl">Withdrawn</div>
        <div class="val text-warning" id="statWithdraw">₦0</div>
      </div>
    </div>

    <!-- Navigation Links -->
    <div class="glass glass-card menu-grid">
      <a href="dashboard.html" class="menu-link"><span class="menu-icon">🏠</span> Dashboard</a>
      <a href="rent-miners.html" class="menu-link"><span class="menu-icon">⛏️</span> Rent Miners</a>
      <a href="my-miners.html" class="menu-link"><span class="menu-icon">📊</span> My Miners</a>
      <a href="wallet.html" class="menu-link"><span class="menu-icon">💳</span> Wallet</a>
      <a href="deposit.html" class="menu-link"><span class="menu-icon">💰</span> Deposit</a>
      <a href="withdraw.html" class="menu-link"><span class="menu-icon">💸</span> Withdraw</a>
      <a href="transactions.html" class="menu-link"><span class="menu-icon">📜</span> History</a>
      <a href="team.html" class="menu-link"><span class="menu-icon">👥</span> My Team</a>
      <a href="gift-code.html" class="menu-link"><span class="menu-icon">🎁</span> Gift Code</a>
      <a href="download-app.html" class="menu-link"><span class="menu-icon">📱</span> Download App</a>
      <a href="notifications.html" class="menu-link"><span class="menu-icon">🔔</span> Notifications</a>
      <a href="index.html" onclick="logout(event)" class="menu-link" style="color: var(--danger);"><span class="menu-icon">🚪</span> Logout</a>
    </div>
  </main>

  <nav class="bottom-nav glass">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
    <a href="rent-miners.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg><span>Miners</span></a>
    <a href="wallet.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>Wallet</span></a>
    <a href="team.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Team</span></a>
    <a href="profile.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
  </nav>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if(!session) return;

      // Fetch Profile
      const { data: profile } = await window.supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
      document.getElementById('profileName').textContent = profile.full_name || 'User';
      document.getElementById('profileEmail').textContent = session.user.email;
      document.getElementById('profileAvatar').textContent = (profile.full_name || 'U')[0].toUpperCase();

      // Fetch Wallet
      const { data: wallet } = await window.supabaseClient.from('wallets').select('balance').eq('user_id', session.user.id).single();
      document.getElementById('statBalance').textContent = '₦' + Number(wallet?.balance || 0).toLocaleString();

      // Fetch Total Deposited (from profile column)
      document.getElementById('statDeposit').textContent = '₦' + Number(profile.total_deposited || 0).toLocaleString();

      // Fetch Total Withdrawn (Sum of completed withdrawals)
      const { data: withdrawals } = await window.supabaseClient.from('transactions').select('amount').eq('user_id', session.user.id).eq('type', 'withdrawal').eq('status', 'completed');
      let totalWith = 0;
      withdrawals?.forEach(w => totalWith += Number(w.amount));
      document.getElementById('statWithdraw').textContent = '₦' + totalWith.toLocaleString();
    });

    function logout(e) {
      e.preventDefault();
      window.supabaseClient.auth.signOut().then(() => window.location.href = 'index.html');
    }
  </script>
</body>
</html>
